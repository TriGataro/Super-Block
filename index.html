<!DOCTYPE html>
<html lang="es" data-tema="clasico">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Cuadro Bros: juego de plataformas con cuadrados de colores, 5 niveles y un jefe final.">
  <title>Cuadro Bros</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Barra superior con las acciones principales -->
  <header class="barra">
    <h1>Cuadro Bros</h1>
    <div class="acciones">
      <button id="btn-alejar" type="button" aria-label="Alejar la pantalla" title="Alejar">🔍−</button>
      <button id="btn-acercar" type="button" aria-label="Acercar la pantalla" title="Acercar">🔍+</button>
      <button id="btn-compartir" type="button" aria-label="Compartir el juego">🔗 Compartir</button>
    </div>
  </header>

  <!-- Aviso para celulares en vertical -->
  <div id="aviso-giro">📱 Gira tu dispositivo para jugar mejor</div>

  <!-- Escenario: joystick (izquierda) | juego | botón de salto (derecha) -->
  <div id="escenario">
    <aside id="zona-joystick" class="zona-tactil" aria-label="Joystick virtual">
      <div id="joy-base"><div id="joy-perilla"></div></div>
    </aside>

    <!-- Aquí Phaser dibuja el juego -->
    <main id="contenedor-juego"></main>

    <aside id="zona-salto" class="zona-tactil" aria-label="Botón de salto">
      <button id="btn-saltar" type="button">SALTAR</button>
    </aside>
  </div>

  <!-- Mensajes breves (compartir, tema, mando conectado) -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Pie de página -->
  <footer>
    <span>Página hecha por</span>
    <a href="https://github.com/TriGataro" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
      </svg>
      <span>Trigataro</span>
    </a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="index.js"></script>
</body>
</html>
